<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--purple:#7c5cfc;--purple-light:#a78bfa;--text:#fff;--muted:#8b8ba7;--border:#2a2a3d;--radius:12px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100}
.logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
.logo-icon{width:32px;height:32px;background:var(--purple);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo span{color:var(--purple-light)}
.hero{text-align:center;padding:24px 20px 10px}
.badge{display:inline-block;background:rgba(124,92,252,.15);color:var(--purple-light);border:1px solid rgba(124,92,252,.3);border-radius:20px;padding:4px 14px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.hero h1{font-size:26px;font-weight:800;line-height:1.2;margin-bottom:8px}
.hero h1 span{color:var(--purple-light)}
.hero p{font-size:13px;color:var(--muted);margin-bottom:16px}
.api-section{margin:0 20px 16px;background:var(--surface);border:1px solid #4a3a8a;border-radius:var(--radius);padding:14px}
.api-section label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:8px}
.api-row{display:flex;gap:8px}
.api-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;outline:none}
.api-input:focus{border-color:var(--purple)}
.save-btn{background:var(--purple);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer}
.status{font-size:12px;margin-top:6px;padding:6px 10px;border-radius:6px;display:none}
.status.ok{background:#0f2a1a;color:#4ade80;display:block}
.status.err{background:#2a0f0f;color:#f87171;display:block}
.tabs{display:flex;margin:0 20px 16px;background:var(--surface);border-radius:var(--radius);padding:4px;gap:4px}
.tab{flex:1;padding:10px;border:none;border-radius:8px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.tab.active{background:var(--purple);color:#fff}
.box{margin:0 20px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.section{padding:14px 16px;border-bottom:1px solid var(--border)}
.slabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.model-btn{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;cursor:pointer;color:var(--text);width:100%;margin-bottom:6px;transition:all .2s}
.model-btn:last-child{margin-bottom:0}
.model-btn.sel{border-color:var(--purple);background:rgba(124,92,252,.1)}
.mname{font-size:13px;font-weight:600}
.mtag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}
.t1{background:rgba(124,92,252,.2);color:var(--purple-light)}
.t2{background:rgba(74,222,128,.15);color:#4ade80}
.t3{background:rgba(251,191,36,.15);color:#fbbf24}
.t4{background:rgba(248,113,113,.15);color:#f87171}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center}
.dot.sel{border-color:var(--purple);background:var(--purple)}
.dot.sel::after{content:'';width:6px;height:6px;background:#fff;border-radius:50%}
.row{display:flex;gap:8px;margin-bottom:8px}
.row:last-child{margin-bottom:0}
select{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;outline:none}
.upload-area{border:1px dashed #4a3a8a;border-radius:8px;padding:16px;text-align:center;cursor:pointer;background:rgba(124,92,252,.03)}
.prompt-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-size:14px;resize:none;outline:none;min-height:90px;font-family:inherit;line-height:1.5}
.prompt-input:focus{border-color:var(--purple)}
.prompt-input::placeholder{color:#4a4a6a}
.err-msg{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:8px;padding:10px 14px;color:#f87171;font-size:13px;margin:0 16px 14px;display:none}
.loading{padding:20px 16px;text-align:center;display:none}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.ltext{color:var(--muted);font-size:14px}
.gen-section{padding:14px 16px}
.gen-btn{width:100%;background:var(--purple);color:#fff;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.gen-btn:hover{background:#5a3dd4}
.gen-btn:disabled{opacity:.6;cursor:not-allowed}
.out-section{margin:0 20px 20px;display:none}
.out-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.out-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
#out-img{width:100%;display:block}
#out-vid{width:100%;display:block}
.dl-btn{display:block;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;margin:12px 16px}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><div class="logo-icon">✦</div>AI<span>Studio</span></div>
</div>
<div class="hero">
  <div class="badge">✦ AI STUDIO</div>
  <h1>Make the <span>impossible.</span></h1>
  <p>Cinematic videos & high-fidelity images powered by AI</p>
</div>
<div class="api-section">
  <label>🔑 Replicate API Key</label>
  <div class="api-row">
    <input type="password" class="api-input" id="api-key" placeholder="r8_xxxxxxxxxxxxxxxx">
    <button class="save-btn" onclick="saveKey()">Save</button>
  </div>
  <div class="status" id="status"></div>
</div>
<div class="tabs">
  <button class="tab active" onclick="switchTab('video',this)">▶ Video</button>
  <button class="tab" onclick="switchTab('image',this)">🖼 Image</button>
</div>
<div class="box">
  <div class="section">
    <div class="slabel">Select Model</div>
    <div id="mgrid"></div>
  </div>
  <div class="section" id="vsettings">
    <div class="slabel">Video Settings</div>
    <div class="row">
      <select id="aspect"><option value="16:9">16:9 Landscape</option><option value="9:16">9:16 Portrait</option><option value="1:1">1:1 Square</option></select>
      <select id="duration"><option value="5">5 sec</option><option value="8" selected>8 sec</option></select>
    </div>
  </div>
  <div class="section" id="upload-sec">
    <div class="slabel">First Frame (optional)</div>
    <div class="upload-area" onclick="document.getElementById('finput').click()">
      <div style="font-size:20px;margin-bottom:4px">+</div>
      <div style="font-size:12px;color:var(--muted)">Add opening frame image</div>
    </div>
    <input type="file" id="finput" accept="image/*" style="display:none" onchange="previewFrame(this)">
    <img id="fpreview" style="display:none;width:100%;border-radius:8px;margin-top:8px;max-height:160px;object-fit:cover">
  </div>
  <div class="section" style="border-bottom:none">
    <div class="slabel">Your Prompt</div>
    <textarea class="prompt-input" id="prompt" placeholder="A slow macro shot of ink blooming through clear water..."></textarea>
  </div>
  <div class="err-msg" id="errmsg"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="ltext" id="ltext">Generating...</div>
  </div>
  <div class="gen-section">
    <button class="gen-btn" id="genbtn" onclick="generate()">Generate ✦ →</button>
  </div>
</div>
<div class="out-section" id="outsec">
  <div class="out-label">Your Creation</div>
  <div class="out-card">
    <img id="out-img" style="display:none">
    <video id="out-vid" controls style="display:none"></video>
    <a class="dl-btn" id="dlbtn" target="_blank">⬇ Download / Open</a>
  </div>
</div>
<script>
const VM=[
  {id:'seedance',name:'Seedance 2.0',tag:'FAST',tc:'t2',model:'bytedance/seedance-1-lite'},
  {id:'wan',name:'Wan 2.1',tag:'LITE',tc:'t3',model:'wavespeedai/wan-2.1-1.3b'},
  {id:'minimax',name:'MiniMax Video',tag:'FLAGSHIP',tc:'t1',model:'minimax/video-01'},
  {id:'ltx',name:'LTX Video',tag:'OMNI',tc:'t4',model:'lightricks/ltx-video'},
];
const IM=[
  {id:'flux-pro',name:'Flux 1.1 Pro',tag:'FLAGSHIP',tc:'t1',model:'black-forest-labs/flux-1.1-pro'},
  {id:'flux-schnell',name:'Flux Schnell',tag:'FAST',tc:'t2',model:'black-forest-labs/flux-schnell'},
  {id:'flux-dev',name:'Flux Dev',tag:'QUALITY',tc:'t3',model:'black-forest-labs/flux-dev'},
];
let tab='video',sel=VM[0],key='',frame=null;
function saveKey(){
  const v=document.getElementById('api-key').value.trim();
  if(!v||!v.startsWith('r8_')){showSt('Invalid key. Must start with r8_','err');return;}
  key=v;showSt('✓ API key saved!','ok');
}
function showSt(m,t){const e=document.getElementById('status');e.textContent=m;e.className='status '+t;setTimeout(()=>e.style.display='none',4000);}
function switchTab(t,btn){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const isV=t==='video';
  document.getElementById('vsettings').style.display=isV?'block':'none';
  document.getElementById('upload-sec').style.display=isV?'block':'none';
  sel=(isV?VM:IM)[0];
  render(isV?VM:IM);
}
function render(models){
  document.getElementById('mgrid').innerHTML=models.map((m,i)=>`
    <button class="model-btn ${i===0?'sel':''}" onclick="selModel(this,'${m.id}')">
      <div class="mname">${m.name}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="mtag ${m.tc}">${m.tag}</span>
        <div class="dot ${i===0?'sel':''}"></div>
      </div>
    </button>`).join('');
}
function selModel(btn,id){
  sel=(tab==='video'?VM:IM).find(m=>m.id===id);
  document.querySelectorAll('.model-btn').forEach(b=>{b.classList.remove('sel');b.querySelector('.dot').classList.remove('sel');});
  btn.classList.add('sel');btn.querySelector('.dot').classList.add('sel');
}
function previewFrame(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{frame=e.target.result;const p=document.getElementById('fpreview');p.src=frame;p.style.display='block';};
  r.readAsDataURL(f);
}
async function generate(){
  if(!key){showErr('Enter and save your Replicate API key!');return;}
  const prompt=document.getElementById('prompt').value.trim();
  if(!prompt){showErr('Write a prompt first!');return;}
  showErr('');setLoad(true);
  const msgs=['Sending to AI...','AI is working...','Creating content...','Almost ready...'];
  let mi=0;
  const iv=setInterval(()=>{document.getElementById('ltext').textContent=msgs[mi++%msgs.length];},4000);
  try{
    const input=tab==='video'
      ?{prompt,aspect_ratio:document.getElementById('aspect').value,duration:parseInt(document.getElementById('duration').value)}
      :{prompt};
    const vRes=await fetch(`https://api.replicate.com/v1/models/${sel.model}/versions`,{headers:{'Authorization':`Token ${key}`}});
    let version=null;
    if(vRes.ok){const vData=await vRes.json();version=vData.results?.[0]?.id;}
    const body=version?{version,input}:{input};
    const url=version?'https://api.replicate.com/v1/predictions':`https://api.replicate.com/v1/models/${sel.model}/predictions`;
    const cRes=await fetch(url,{method:'POST',headers:{'Authorization':`Token ${key}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!cRes.ok){const e=await cRes.json();throw new Error(e.detail||JSON.stringify(e));}
    let pred=await cRes.json();
    let attempts=0;
    while(pred.status!=='succeeded'&&pred.status!=='failed'&&attempts<60){
      await sleep(4000);
      const pRes=await fetch(`https://api.replicate.com/v1/predictions/${pred.id}`,{headers:{'Authorization':`Token ${key}`}});
      pred=await pRes.json();attempts++;
    }
    clearInterval(iv);
    if(pred.status==='failed')throw new Error(pred.error||'Generation failed');
    if(!pred.output)throw new Error('No output. Try again.');
    const out=Array.isArray(pred.output)?pred.output[0]:pred.output;
    showOutput(out);
  }catch(err){
    clearInterval(iv);
    showErr(err.message||'Failed. Check API key and credits.');
  }
  setLoad(false);
}
function showOutput(url){
  const img=document.getElementById('out-img'),vid=document.getElementById('out-vid'),dl=document.getElementById('dlbtn');
  if(tab==='image'){img.src=url;img.style.display='block';vid.style.display='none';}
  else{vid.src=url;vid.style.display='block';img.style.display='none';}
  dl.href=url;
  document.getElementById('outsec').style.display='block';
  document.getElementById('outsec').scrollIntoView({behavior:'smooth'});
}
function showErr(m){const e=document.getElementById('errmsg');e.textContent=m;e.style.display=m?'block':'none';}
function setLoad(v){
  document.getElementById('loading').style.display=v?'block':'none';
  const b=document.getElementById('genbtn');b.disabled=v;b.textContent=v?'Generating...':'Generate ✦ →';
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
render(VM);
</script>
</body>
      </html>
